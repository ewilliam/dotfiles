# =============================================================================
# Prefix
# =============================================================================

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# =============================================================================
# General
# =============================================================================

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

set -g history-limit 10000
# Note: tmux-sensible overrides this to 0 at plugin load time
set -sg escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# =============================================================================
# Mouse
# =============================================================================

set -g mouse on

# =============================================================================
# Vi copy mode
# =============================================================================

setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
# y is managed by tmux-yank (copies to system clipboard); no manual binding needed
bind-key -T copy-mode-vi Escape send-keys -X cancel

# =============================================================================
# Splits and navigation (smart — inherit current path)
# =============================================================================

bind | split-window -h -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane resize (repeatable)
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

# Pane navigation — vim-tmux-navigator aware
# Passes C-h/j/k/l through to vim/nvim when it's the active pane command
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n 'C-\' if-shell "$is_vim" "send-keys 'C-\\'" "select-pane -l"

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# New windows inherit current path
bind c new-window -c "#{pane_current_path}"

# =============================================================================
# Status bar
# =============================================================================

set -g status on
set -g status-interval 5
set -g status-position bottom

set -g status-left " #S "
set -g status-left-length 20
set -g status-right " %Y-%m-%d %H:%M "
set -g status-right-length 30

setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #[bold]#I:#W#[nobold] "

# =============================================================================
# TPM — Tmux Plugin Manager
# =============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TPM (keep this line at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
