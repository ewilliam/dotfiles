# clamd.conf - ClamAV daemon configuration
# Managed via ~/Projects/dotfiles

# Database directory (must match freshclam.conf)
DatabaseDirectory /opt/homebrew/var/lib/clamav

# Local socket for communication
LocalSocket /tmp/clamd.sock
FixStaleSocket yes

# Logging
LogFile /opt/homebrew/var/log/clamd.log
LogTime yes
LogRotate yes
LogFileMaxSize 2M

# Performance
MaxThreads 4
MaxDirectoryRecursion 20
FollowDirectorySymlinks no
FollowFileSymlinks no
CrossFilesystems yes

# Scan limits (protect against DoS / archive bombs)
MaxScanTime 120000
MaxScanSize 400M
MaxFileSize 100M
MaxRecursion 17
MaxFiles 10000

# File type scanning
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanOneNote yes
ScanMail yes
ScanHTML yes
ScanArchive yes
ScanImage yes
ScanImageFuzzyHash yes

# Heuristics
HeuristicAlerts yes
Bytecode yes

# Phishing
PhishingSignatures yes
PhishingScanURLs yes

# Self check interval (seconds)
SelfCheck 600
