# freshclam.conf - ClamAV database updater configuration
# Managed via ~/Projects/dotfiles

# Database directory (must match clamd.conf)
DatabaseDirectory /opt/homebrew/var/lib/clamav

# Official ClamAV database mirror (uses CloudFlare CDN)
DatabaseMirror database.clamav.net

# Log freshclam update activity
UpdateLogFile /opt/homebrew/var/log/freshclam.log
LogTime yes
LogRotate yes
LogFileMaxSize 2M

# Number of database checks per day (every 2 hours)
Checks 12

# Connection timeouts
ConnectTimeout 30
ReceiveTimeout 60

# Verify databases load correctly before replacing old ones
TestDatabases yes

# Download bytecode signatures
Bytecode yes
